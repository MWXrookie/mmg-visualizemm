<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>知识卡片 · 决策树 · 模型视界</title>
<style>
  :root {
    --bg: oklch(0.978 0.005 256.4);
    --surface: oklch(1 0 0);
    --fg: oklch(0.279 0.03 257);
    --muted: oklch(0.554 0.022 257);
    --border: oklch(0.928 0.006 257);
    --accent: oklch(0.546 0.213 258);
    --accent-soft: color-mix(in oklch, var(--accent) 12%, var(--surface));
    --accent-fg: oklch(1 0 0);
    --ok: oklch(0.52 0.12 155);

    --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-mono: 'SF Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace;

    --radius: 10px;
    --radius-sm: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  img, svg { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  p { text-wrap: pretty; }
  h3, h4 { text-wrap: balance; }

  .icon { width: 18px; height: 18px; flex: none; }
  .icon-sm { width: 15px; height: 15px; flex: none; }

  .topnav {
    position: sticky; top: 0; z-index: 20; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    background: color-mix(in oklch, var(--surface) 88%, transparent);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
  }
  .tn-left { display: flex; align-items: center; gap: 14px; }
  .logo { display: flex; align-items: center; gap: 9px; }
  .logo-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--accent); color: var(--accent-fg); display: grid; place-items: center;
  }
  .logo-name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .tn-right { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: var(--muted); display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--bg); color: var(--fg); border-color: var(--border); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: color-mix(in oklch, var(--accent) 16%, var(--surface));
    color: var(--accent); font-size: 13px; font-weight: 600;
    display: grid; place-items: center; margin-left: 4px;
  }

  .page { max-width: 760px; margin-inline: auto; padding: 32px 24px 72px; }

  .kc-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .kc-head {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 22px; border-bottom: 1px solid var(--border);
  }
  .kc-tag {
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    color: var(--accent); background: var(--accent-soft);
    padding: 3px 10px; border-radius: 999px;
  }
  .kc-head h3 { font-size: 18px; font-weight: 650; margin: 0; }

  .kc-concept { padding: 14px 22px 18px; }
  .kc-concept p { margin: 0; font-size: 14.5px; line-height: 1.7; color: var(--fg); }
  .kc-concept .k { color: var(--muted); font-size: 12.5px; }

  .demo {
    margin: 0 22px 20px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: color-mix(in oklch, var(--bg) 60%, var(--surface));
    display: grid; grid-template-columns: 170px 1fr; min-height: 244px;
  }
  @media (max-width: 640px) { .demo { grid-template-columns: 1fr; } }
  .demo-panel {
    border-right: 1px solid var(--border);
    padding: 16px; display: flex; flex-direction: column; gap: 14px;
  }
  @media (max-width: 640px) { .demo-panel { border-right: 0; border-bottom: 1px solid var(--border); } }
  .dp-label { font-size: 12px; color: var(--muted); }
  .dp-val { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }
  .dp-val b { font-family: var(--font-mono); font-size: 20px; }
  .dp-val span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .slider { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .slider:focus-visible { outline: 2px solid var(--accent-soft); border-radius: 4px; }
  .play-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 36px; border-radius: var(--radius-sm); border: 0;
    background: var(--accent); color: var(--accent-fg);
    font-size: 13.5px; font-weight: 500;
    transition: background 0.15s ease;
  }
  .play-btn:hover { background: color-mix(in oklch, var(--accent) 88%, black); }
  .play-btn:active { transform: translateY(1px); }
  .play-btn:focus-visible { outline: 2px solid color-mix(in oklch, var(--accent) 40%, white); outline-offset: 1px; }
  .depth-legend { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }

  .demo-canvas { display: grid; place-items: center; padding: 10px; min-width: 0; }
  .demo-canvas svg { width: 100%; max-width: 460px; height: auto; }
  .tree-node rect { fill: var(--surface); stroke: var(--border); stroke-width: 1.2; transition: stroke 0.2s ease, fill 0.2s ease; }
  .tree-node text { font-family: var(--font-body); font-size: 11px; fill: var(--fg); }
  .tree-node .leaf text { fill: var(--muted); }
  .tree-node.cond rect { fill: var(--surface); }
  .tree-node.leaf rect { fill: var(--accent-soft); stroke: color-mix(in oklch, var(--accent) 40%, var(--border)); }
  .tree-node.leaf text { fill: var(--accent); font-weight: 600; }
  .tree-node.hl rect { stroke: var(--accent); stroke-width: 2.2; }
  .tree-node.hl text { fill: var(--fg); }
  .tree-edge { stroke: var(--border); stroke-width: 1.4; }
  .tree-edge.on { stroke: var(--accent); stroke-width: 1.8; }

  .try { padding: 0 22px 20px; }
  .try-box {
    border: 1px dashed color-mix(in oklch, var(--accent) 45%, var(--border));
    border-radius: var(--radius-sm); padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    background: var(--accent-soft);
  }
  .try-box p { margin: 0; font-size: 14px; }
  .try-box p b { font-weight: 650; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface); color: var(--fg);
    font-size: 13px; flex: none;
    transition: border-color 0.15s ease;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
  @media (max-width: 560px) { .try-box { flex-direction: column; align-items: flex-start; } }

  .kc-foot {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 14px 22px; border-top: 1px solid var(--border);
  }
  .fav {
    display: inline-flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--accent);
    font-size: 13px; font-weight: 500;
  }
  .fav:hover { background: var(--accent-soft); }
  .fav:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
  .fav[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .rel { display: flex; align-items: center; gap: 8px; }
  .rel-label { font-size: 12px; color: var(--muted); }
  .rel a { font-size: 13px; color: var(--accent); }
  .rel a:hover { text-decoration: underline; }
  .rel .sep { color: var(--border); }
</style>
</head>
<body>
  <header class="topnav" data-od-id="topnav">
    <div class="tn-left">
      <a class="logo" href="index.html">
        <span class="logo-mark">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5m8 14V5m8 14V9"/></svg>
        </span>
        <span class="logo-name">模型视界</span>
      </a>
    </div>
    <div class="tn-right">
      <a class="icon-btn" href="workbench.html" aria-label="返回工作台">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
      </a>
      <span class="avatar">张</span>
    </div>
  </header>

  <main class="page">
    <div class="kc-card" data-od-id="knowledge-card">
      <div class="kc-head">
        <span class="kc-tag">模型概念</span>
        <h3>决策树</h3>
      </div>

      <div class="kc-concept">
        <p><b>按条件逐层划分数据的分类方法。</b>每个内部节点是一次判断，每条路径是一组规则的组合，叶子给出最终结论。</p>
        <p class="k">适用：题目逻辑存在「先判断、再分支」结构时的思路拆解。</p>
      </div>

      <div class="demo" data-od-id="demo">
        <div class="demo-panel">
          <div>
            <div class="dp-label">最大深度</div>
            <div class="dp-val"><b id="depth-val">3</b><span>/ 6</span></div>
            <input class="slider" type="range" id="depth-slider" min="1" max="6" value="3" aria-label="最大深度" />
            <div class="depth-legend"><span>1</span><span>6</span></div>
          </div>
          <button class="play-btn" id="play-btn" aria-label="逐层生长">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5.5v13l10-6.5z"/></svg>
            逐层生长
          </button>
          <div class="dp-label" id="play-state">点击播放，看树一层层长出来</div>
        </div>
        <div class="demo-canvas" id="canvas">
          <svg id="tree-svg" viewBox="0 0 460 236" role="img" aria-label="决策树结构示意"></svg>
        </div>
      </div>

      <div class="try" data-od-id="try-area">
        <div class="try-box">
          <p><b>试一试：</b>为什么这道采购题适合用决策树来拆解建模思路？</p>
          <button class="btn-ghost">查看提示
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
      </div>

      <div class="kc-foot">
        <button class="fav" id="fav-btn" aria-pressed="false">
          <svg class="icon-sm" id="fav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.9-5.4 2.9 1-6L3.3 9.4l6-.9z"/></svg>
          <span id="fav-label">收藏</span>
        </button>
        <div class="rel">
          <span class="rel-label">相关概念</span>
          <a href="#">随机森林</a>
          <span class="sep">·</span>
          <a href="#">回归树</a>
        </div>
      </div>
    </div>
  </main>

<script>
  (function () {
    var labels = [
      { cond: '需求量 > 6000?', leaf: '考虑备货' },
      { cond: '单价波动大?', leaf: '分批采购' },
      { cond: '库存周转高?', leaf: '正常补货' },
      { cond: '仓储成本高?', leaf: '按需采购' },
      { cond: '需求增长快?', leaf: '提前建仓' },
      { cond: '订单稳定?', leaf: '定期补货' }
    ];

    var svg = document.getElementById('tree-svg');
    var depthSlider = document.getElementById('depth-slider');
    var depthVal = document.getElementById('depth-val');
    var playBtn = document.getElementById('play-btn');
    var playState = document.getElementById('play-state');

    var W = 460, H = 236, topPad = 34, nodeW = 96, nodeH = 32;

    function nodeData(depth) {
      var nodes = [];
      for (var lv = 0; lv <= depth; lv++) {
        var count = Math.pow(2, lv);
        var y = topPad + (lv * (H - topPad - 40)) / depth;
        for (var i = 0; i < count; i++) {
          var span = W / count;
          var x = span * i + span / 2;
          nodes.push({ lv: lv, i: i, x: x, y: y, count: count });
        }
      }
      return nodes;
    }

    function drawTree(depth, showLevel, playedLv) {
      var nodes = nodeData(depth);
      var g = '';
      var edges = [];
      var prev = [];
      var offset = Math.floor(30 / Math.pow(2, depth - 1)) || 0;
      for (var n = 0; n < nodes.length; n++) {
        var nd = nodes[n];
        if (nd.lv === 0) prev = [nd];
        if (nd.lv > 0) {
          var pi = Math.floor(nd.i / 2);
          var pn = prev[pi];
          if (pn) {
            edges.push({ x1: pn.x, y1: pn.y + nodeH / 2, x2: nd.x, y2: nd.y - nodeH / 2 });
          }
        }
        if (nd.lv === depth) prev = nodes.filter(function (x) { return x.lv === depth - 1; });
      }

      for (var e = 0; e < edges.length; e++) {
        var ed = edges[e];
        var on = playedLv >= ed.y1 && ed.x1 > 0;
        g += '<line class="tree-edge' + (on ? ' on' : '') + '" x1="' + ed.x1 + '" y1="' + ed.y1 + '" x2="' + ed.x2 + '" y2="' + ed.y2 + '"/>';
      }

      for (var m = 0; m < nodes.length; m++) {
        var nn = nodes[m];
        var isLeaf = nn.lv === depth;
        var isCond = !isLeaf;
        var lbl = isLeaf ? labels[(nn.i * 2) % labels.length].leaf : labels[(nn.i) % labels.length].cond;
        var cls = isLeaf ? 'tree-node leaf' : 'tree-node cond';
        if (showLevel && nn.lv === showLevel) cls += ' hl';
        g += '<g class="' + cls + '">';
        g += '<rect x="' + (nn.x - nodeW / 2) + '" y="' + (nn.y - nodeH / 2) + '" width="' + nodeW + '" height="' + nodeH + '" rx="7"/>';
        g += '<text x="' + nn.x + '" y="' + (nn.y + 3.5) + '" text-anchor="middle">' + lbl + '</text>';
        g += '</g>';
      }
      svg.innerHTML = g;
    }

    var animTimer = null;
    function stopAnim() {
      if (animTimer) { clearTimeout(animTimer); animTimer = null; }
    }
    function animate(depth) {
      stopAnim();
      playBtn.disabled = true;
      playState.textContent = '正在生长…';
      var lv = 0;
      function step() {
        drawTree(depth, lv, lv);
        playState.textContent = '已长到第 ' + (lv + 1) + ' 层 / 共 ' + (depth + 1) + ' 层';
        lv++;
        if (lv <= depth) animTimer = setTimeout(step, 520);
        else {
          playBtn.disabled = false;
          playBtn.innerHTML = '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14l12-7z"/></svg>重播';
          playState.textContent = '生长完成';
        }
      }
      step();
    }

    function setDepth(v) {
      stopAnim();
      depthVal.textContent = v;
      playBtn.disabled = false;
      playBtn.innerHTML = '<svg class="icon-sm" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5.5v13l10-6.5z"/></svg>逐层生长';
      playState.textContent = v >= 6 ? '深度 6：树较深，展开全部叶子' : '拖动滑块或点击播放';
      drawTree(v, null, null);
    }

    depthSlider.addEventListener('input', function () {
      setDepth(parseInt(this.value, 10));
    });
    playBtn.addEventListener('click', function () {
      animate(parseInt(depthSlider.value, 10));
    });

    document.getElementById('fav-btn').addEventListener('click', function () {
      var pressed = this.getAttribute('aria-pressed') === 'true';
      this.setAttribute('aria-pressed', String(!pressed));
      document.getElementById('fav-label').textContent = pressed ? '收藏' : '已收藏';
      document.getElementById('fav-ico').setAttribute('fill', pressed ? 'none' : 'currentColor');
    });

    setDepth(3);
  })();
</script>
</body>
</html>
