<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>模型设置 · 数学建模 AI 辅导</title>
<style>
  :root {
    --bg: #f6f8fb;
    --surface: #ffffff;
    --surface-2: #eef3fa;
    --fg: #16202e;
    --muted: #5b6b81;
    --faint: #93a2b6;
    --border: #dfe6f0;
    --border-strong: #c6d2e4;
    --accent: #3b82f6;
    --accent-2: #2563eb;
    --accent-grad: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    --accent-soft: #eaf2ff;
    --success: #16a34a;
    --success-bg: #e8f7ee;
    --danger: #dc2626;
    --danger-bg: #fdeaeb;
    --sidebar: #ffffff;
    --shadow: 0 1px 2px rgba(22,32,46,.04), 0 8px 24px rgba(22,32,46,.06);
    --shadow-pop: 0 12px 40px rgba(22,32,46,.12);
    --radius: 10px;
    --radius-sm: 8px;
    --ease: cubic-bezier(.4,0,.2,1);
  }
  html[data-theme="dark"] {
    --bg: #0e1420;
    --surface: #161f2e;
    --surface-2: #1d2839;
    --fg: #eef2f8;
    --muted: #a8b6c8;
    --faint: #76879c;
    --border: #263344;
    --border-strong: #3a4a60;
    --accent: #60a5fa;
    --accent-2: #3b82f6;
    --accent-grad: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
    --accent-soft: #12233f;
    --success: #4ade80;
    --success-bg: #14301f;
    --danger: #f87171;
    --danger-bg: #3a1d20;
    --sidebar: #121a27;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
    --shadow-pop: 0 16px 48px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Avenir Next", "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background .3s var(--ease), color .3s var(--ease);
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select { font: inherit; font-family: inherit; color: var(--fg); }

  /* ---------- Layout shell ---------- */
  .shell { display: flex; min-height: 100vh; width: 100%; }
  .sidebar {
    width: 236px; flex: 0 0 236px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 22px 16px 18px;
    position: sticky; top: 0; height: 100vh;
    transition: background .3s var(--ease);
  }
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

  /* ---------- Sidebar: brand ---------- */
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 20px; }
  .brand-mark {
    width: 34px; height: 34px; flex: 0 0 34px; border-radius: 9px;
    background: var(--accent-grad);
    display: grid; place-items: center;
    box-shadow: 0 4px 12px rgba(59,130,246,.35);
  }
  .brand-mark svg { width: 19px; height: 19px; stroke: #fff; }
  .brand-name { font-size: 15px; font-weight: 700; letter-spacing: .2px; line-height: 1.2; }
  .brand-name small { display: block; font-size: 10.5px; color: var(--faint); font-weight: 500; letter-spacing: .4px; }

  /* ---------- Sidebar: nav ---------- */
  .nav-label {
    font-size: 11px; font-weight: 600; letter-spacing: .8px;
    color: var(--faint); text-transform: uppercase;
    padding: 10px 10px 8px;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 10px; border-radius: var(--radius-sm);
    color: var(--muted); font-size: 14px; font-weight: 500;
    position: relative; transition: background .18s var(--ease), color .18s var(--ease);
  }
  .nav-item svg { width: 18px; height: 18px; stroke: currentColor; flex: 0 0 18px; }
  .nav-item:hover { background: var(--surface-2); color: var(--fg); }
  .nav-item.active {
    background: var(--accent-soft); color: var(--accent-2);
    font-weight: 600;
  }
  html[data-theme="dark"] .nav-item.active { color: var(--accent); }
  .nav-item.active::before {
    content: ""; position: absolute; left: -16px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 20px; border-radius: 2px; background: var(--accent-grad);
  }
  .nav-more {
    border: 1.5px dashed var(--border-strong);
    background: transparent; color: var(--faint);
  }
  .nav-more:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- Sidebar: bottom ---------- */
  .sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 16px; border-top: 1px solid var(--border); }
  .theme-toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; border-radius: var(--radius-sm);
    color: var(--muted); font-size: 13.5px; font-weight: 500;
    transition: background .18s var(--ease);
  }
  .theme-toggle:hover { background: var(--surface-2); color: var(--fg); }
  .theme-toggle .icon { width: 18px; height: 18px; stroke: currentColor; }
  .theme-toggle .row { display: flex; align-items: center; gap: 11px; }

  /* switch */
  .switch { width: 40px; height: 22px; border-radius: 999px; background: var(--border-strong); position: relative; flex: 0 0 40px; cursor: pointer; transition: background .2s var(--ease); }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .22s var(--ease); }
  html[data-theme="dark"] .switch { background: var(--accent-2); }
  html[data-theme="dark"] .switch .knob { transform: translateX(18px); }

  /* ---------- Content ---------- */
  .content { padding: 56px clamp(28px, 5vw, 72px) 72px; width: 100%; max-width: 1020px; }

  .page-head { max-width: 760px; margin-left: auto; margin-right: auto; margin-bottom: 28px; }
  .eyebrow {
    font-family: ui-monospace, "SFMono-Regular", "Roboto Mono", Menlo, monospace;
    font-size: 11.5px; letter-spacing: 2px; color: var(--accent-2);
    text-transform: uppercase; font-weight: 600; margin-bottom: 12px;
  }
  html[data-theme="dark"] .eyebrow { color: var(--accent); }
  .page-head h1 { font-size: 30px; font-weight: 750; letter-spacing: -.4px; line-height: 1.25; }
  .page-sub { color: var(--muted); font-size: 14.5px; margin-top: 10px; max-width: 560px; }
  .page-sub strong { color: var(--fg); font-weight: 600; }

  /* ---------- Form card ---------- */
  .form-card {
    max-width: 760px; margin-left: auto; margin-right: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: clamp(24px, 3vw, 34px);
    transition: background .3s var(--ease);
  }
  .field { margin-bottom: 22px; }
  .field:last-of-type { margin-bottom: 0; }
  .field .lbl { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; margin-bottom: 9px; }
  .field .lbl .req { color: var(--danger); }
  .field .hint { font-size: 12.5px; color: var(--faint); margin-top: 7px; line-height: 1.5; }

  /* provider cards */
  .provider-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .provider-card {
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); padding: 13px 12px;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
    cursor: pointer; text-align: left;
    transition: border-color .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease);
  }
  .provider-card:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .provider-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .provider-card .radio-dot {
    width: 18px; height: 18px; border-radius: 50%; flex: 0 0 18px;
    border: 2px solid var(--border-strong); position: relative; transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .provider-card .p-name { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  .provider-card .p-desc { font-size: 11.5px; color: var(--faint); line-height: 1.4; }
  .provider-card.selected {
    border-color: var(--accent);
    background: linear-gradient(180deg, var(--accent-soft), transparent 85%);
    box-shadow: 0 0 0 1px var(--accent), 0 6px 16px rgba(59,130,246,.12);
  }
  .provider-card.selected .radio-dot { border-color: var(--accent); box-shadow: inset 0 0 0 4px var(--surface), 0 0 0 1px var(--accent); }
  .provider-card.selected .p-name { color: var(--accent-2); }
  html[data-theme="dark"] .provider-card.selected .p-name { color: var(--accent); }

  /* text inputs */
  .input-wrap { position: relative; display: block; }
  .input { width: 100%; padding: 11px 13px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--bg); font-size: 14px; transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease); }
  .input::placeholder { color: var(--faint); }
  .input:hover { border-color: var(--border-strong); }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
  .input[disabled] { opacity: .5; cursor: not-allowed; }
  .input-wrap .toggle-eye { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); width: 34px; height: 34px; display: grid; place-items: center; border-radius: 7px; color: var(--faint); transition: color .15s var(--ease), background .15s var(--ease); }
  .input-wrap .toggle-eye:hover { color: var(--accent); background: var(--accent-soft); }
  .input-wrap .toggle-eye:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .input-wrap .toggle-eye svg { width: 19px; height: 19px; }
  .input-wrap .input { padding-right: 52px; }

  /* actions */
  .actions { display: flex; align-items: center; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; letter-spacing: .1px; transition: transform .15s var(--ease), box-shadow .15s var(--ease), opacity .15s var(--ease); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--accent-grad); color: #fff; box-shadow: 0 6px 14px rgba(37,99,235,.32); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(37,99,235,.4); }
  .btn-primary:active { transform: translateY(0); box-shadow: 0 4px 10px rgba(37,99,235,.3); }
  .btn-primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border-strong); }
  .btn-ghost:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .btn-ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-ghost:disabled { opacity: .5; cursor: not-allowed; }

  /* result toast */
  .result { display: none; align-items: flex-start; gap: 9px; margin-top: 16px; padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13.5px; line-height: 1.5; width: 100%; }
  .result svg { width: 17px; height: 17px; flex: 0 0 17px; margin-top: 2px; }
  .result.ok { background: var(--success-bg); color: var(--success); display: flex; }
  .result.err { background: var(--danger-bg); color: var(--danger); display: flex; }
  .result .r-title { font-weight: 700; }

  .divider { height: 1px; background: var(--border); margin: 24px 0; }

  .save-msg { font-size: 12.5px; color: var(--success); display: none; align-items: center; gap: 6px; }
  .save-msg.show { display: inline-flex; }
  .save-msg svg { width: 14px; height: 14px; }

  /* spinner */
  .spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-ghost .spinner { border-color: var(--border-strong); border-top-color: var(--accent); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1024px) {
    .provider-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 768px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; flex: none; height: auto; position: static; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 6px; padding: 14px 16px; border-right: none; border-bottom: 1px solid var(--border); }
    .brand { padding: 0; margin-right: 8px; }
    .brand-name small { display: none; }
    .nav { flex-direction: row; flex-wrap: wrap; gap: 6px; }
    .nav-label, .nav-item.active::before { display: none; }
    .nav-item { padding: 7px 10px; font-size: 13px; }
    .sidebar-foot { margin-top: 0; margin-left: auto; border-top: none; padding-top: 0; }
    .theme-toggle { padding: 6px 8px; }
    .theme-toggle .lbl { display: none; }
    .theme-toggle .row { gap: 6px; }
    .content { padding: 32px 20px 56px; }
    .page-head h1 { font-size: 25px; }
  }
  @media (max-width: 480px) {
    .provider-grid { grid-template-columns: 1fr; }
    .actions { flex-direction: column; align-items: stretch; }
    .btn { justify-content: center; }
  }

/* === 浅色模式区块分隔增强（追加） === */
:root{
  --border:#ccd5e2;
  --shadow-soft:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.05);
}
:root[data-theme='dark']{ --border:#263449; }
.app > *, .main > *, .panel, aside, nav, section, .card {
  box-shadow: inset 0 0 0 1px var(--border);
}
.rail, .sidebar { box-shadow: inset -1px 0 0 var(--border); }

</style>
</head>
<body>
  <div class="shell">

    <!-- ============ LEFT FUNCTION BAR ============ -->
    <aside class="sidebar" data-od-id="sidebar">
      <div class="brand" data-od-id="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 4v5c0 4.6-3.2 7.8-7 9-3.8-1.2-7-4.4-7-9V7l7-4z"/><path d="M9.5 12l1.8 1.8 3.2-3.6"/></svg>
        </div>
        <div class="brand-name">数模助研<span>Math AI Tutor</span></div>
      </div>

      <div class="nav-label">工作台</div>
      <nav class="nav" data-od-id="workspace-nav">
        <a class="nav-item" data-od-id="nav-read" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V5a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H18a2 2 0 0 1 2 2"/></svg>
          读题工作台
        </a>
        <a class="nav-item" data-od-id="nav-outline" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5v13M15 5v4M15 13v5M9 9h6"/><rect x="4" y="3" width="16" height="18" rx="2"/></svg>
          建模思路梳理台
        </a>
        <a class="nav-item" data-od-id="nav-coding" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg>
          编程工作台
        </a>
        <button class="nav-item nav-more" data-od-id="nav-more">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          更多
        </button>
      </nav>

      <div class="sidebar-foot">
        <button class="nav-item active" data-od-id="nav-settings" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.04 4.3l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          模型设置
        </button>
        <button class="theme-toggle" id="themeToggle" data-od-id="theme-toggle" aria-pressed="false">
          <span class="row">
            <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <span class="lbl">深色模式</span>
          </span>
          <span class="switch" role="switch" aria-checked="false"><span class="knob"></span></span>
        </button>
      </div>
    </aside>

    <!-- ============ RIGHT CONTENT ============ -->
    <main class="main">
      <div class="content" data-od-id="content">
        <div class="page-head" data-od-id="page-head">
          <div class="eyebrow">Settings</div>
          <h1>模型设置</h1>
          <p class="page-sub">配置数学建模模型 API，用于全程的读题、思路梳理与编程辅导。<strong>Key 只保存在本浏览器（加密存储），不会上传服务器。</strong></p>
        </div>

        <form class="form-card" id="settingsForm" data-od-id="settings-form" novalidate>

          <!-- Provider -->
          <div class="field" data-od-id="provider-field">
            <label class="lbl">模型服务商<span class="req">*</span></label>
            <div class="provider-grid" role="radiogroup" data-od-id="provider-grid">

                <span class="radio-dot"></span>
                <span class="p-name">通义百炼</span>
                <span class="p-desc">阿里 Qwen 系列</span>
              </button>
              <button type="button" class="provider-card" data-od-id="provider-deepseek" data-provider="deepseek" data-model="deepseek-chat" data-base="https://api.deepseek.com/v1" role="radio" aria-checked="false">
                <span class="radio-dot"></span>
                <span class="p-name">DeepSeek</span>
                <span class="p-desc">推理模型 R1</span>
              </button>
              <button type="button" class="provider-card" data-od-id="provider-openai" data-provider="openai" data-model="gpt-4o" data-base="https://api.openai.com/v1" role="radio" aria-checked="false">
                <span class="radio-dot"></span>
                <span class="p-name">OpenAI</span>
                <span class="p-desc">GPT 系列</span>
              </button>
              <button type="button" class="provider-card" data-od-id="provider-custom" data-provider="custom" data-model="" data-base="https://api.example.com/v1" role="radio" aria-checked="false">
                <span class="radio-dot"></span>
                <span class="p-name">自定义</span>
                <span class="p-desc">OpenAI 兼容</span>
              </button>
            </div>
          </div>

          <!-- API Key -->
          <div class="field" data-od-id="key-field">
            <label class="lbl" for="apiKey">API Key<span class="req">*</span></label>
            <div class="input-wrap">
              <input class="input" id="apiKey" name="apiKey" type="password" placeholder="sk-••••••••••••••••" autocomplete="off" spellcheck="false" data-od-id="api-key" />
              <button type="button" class="toggle-eye" id="toggleKey" data-od-id="toggle-key" aria-label="显示 / 隐藏 Key">
                <svg class="ic-eyes-open" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="ic-eyes-closed" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M3 3l18 18"/><path d="M10.6 10.7a3 3 0 0 0 4.1 4.2"/><path d="M6.6 6.9A17 17 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/><path d="M17.4 8.1A17 17 0 0 1 22 12s-3.5 7-10 7"/></svg>
              </button>
            </div>
            <div class="hint">加密存储于本机浏览器，仅用于发起模型请求，绝不外传。</div>
          </div>

          <!-- Base URL (custom only) -->
          <div class="field" data-od-id="base-field" id="baseField" style="display:none">
            <label class="lbl" for="baseUrl">Base URL</label>
            <div class="input-wrap">
              <input class="input" id="baseUrl" name="baseUrl" type="url" placeholder="https://api.deepseek.com/v1" spellcheck="false" data-od-id="base-url" />
            </div>
            <div class="hint">OpenAI 兼容接口的 API 根地址，自定义服务商时需填写。</div>
          </div>

          <!-- Base URL hint when preset (non-custom) -->
          <div class="field" data-od-id="base-field" id="presetBaseField" style="display:none">
            <label class="lbl" for="baseUrlPreset">Base URL</label>
            <div class="input-wrap">
              <input class="input" id="baseUrlPreset" type="text" value="https://dashscope.aliyuncs.com/compatible-mode/v1" readonly disabled data-od-id="base-url" />
            </div>
            <div class="hint">已由服务商预设，自定义时可编辑。</div>
          </div>

          <!-- Model name -->
          <div class="field" data-od-id="model-field">
            <label class="lbl" for="modelName">模型名<span class="req">*</span></label>
            <div class="input-wrap">
              <input class="input" id="modelName" name="modelName" type="text" placeholder="qwen-plus" spellcheck="false" data-od-id="model-name" />
            </div>
            <div class="hint">例如 <strong>qwen-plus</strong> / <strong>deepseek-chat</strong>。</div>
          </div>

          <!-- Actions -->
          <div class="actions" data-od-id="form-actions">
            <button type="button" class="btn btn-primary" id="testBtn" data-od-id="test-connection">
              <span>测试连接</span>
            </button>

            <div class="result" id="resultToast" data-od-id="result-toast" role="status" aria-live="polite"></div>

            <div style="flex:1"></div>
            <button type="submit" class="btn btn-ghost" id="saveBtn" data-od-id="save-settings">保存设置</button>
          </div>

          <div class="divider"></div>
          <div class="save-msg" id="saveMsg" data-od-id="save-msg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            设置已保存到本浏览器
          </div>
        </form>
      </div>
    </main>
  </div>

<script>
(function () {
  var theme = localStorage.getItem('model-settings-theme') || 'light';
  var root = document.documentElement;
  root.setAttribute('data-theme', theme);
  syncThemeUI();

  function syncThemeUI() {
    var dark = root.getAttribute('data-theme') === 'dark';
    document.getElementById('themeToggle').setAttribute('aria-pressed', String(dark));
    var sw = document.getElementById('themeToggle').querySelector('.switch');
    sw.setAttribute('aria-checked', String(dark));
  }
  document.getElementById('themeToggle').addEventListener('click', function () {
    var cur = root.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('model-settings-theme', next);
    syncThemeUI();
  });

  /* ---------- Provider selection ---------- */
  var cards = Array.prototype.slice.call(document.querySelectorAll('.provider-card'));
  var baseField = document.getElementById('baseField');
  var presetField = document.getElementById('presetBaseField');
  var modelInput = document.getElementById('modelName');
  var presetInput = document.getElementById('baseUrlPreset');

  function applyProvider(card) {
    cards.forEach(function (c) {
      var sel = c === card;
      c.classList.toggle('selected', sel);
      c.setAttribute('aria-checked', String(sel));
    });
    if (card.dataset.provider === 'custom') {
      baseField.style.display = 'block';
      presetField.style.display = 'none';
    } else {
      baseField.style.display = 'none';
      presetField.style.display = 'block';
      presetInput.value = card.dataset.base || '';
    }
    if (card.dataset.model) {
      modelInput.placeholder = card.dataset.model;
      if (!modelInput.value || /^(qwen|deepseek|gpt)/.test(modelInput.value)) {
        modelInput.value = '';
        modelInput.placeholder = card.dataset.model;
      }
    }
    hideResult();
  }
  cards.forEach(function (card) {
    card.addEventListener('click', function () { applyProvider(card); });
  });
  applyProvider(cards[0]);

  /* ---------- Key show / hide ---------- */
  var keyInput = document.getElementById('apiKey');
  var toggleKey = document.getElementById('toggleKey');
  toggleKey.addEventListener('click', function () {
    var hidden = keyInput.type === 'password';
    keyInput.type = hidden ? 'text' : 'password';
    toggleKey.querySelector('.ic-eyes-open').style.display = hidden ? 'none' : 'block';
    toggleKey.querySelector('.ic-eyes-closed').style.display = hidden ? 'block' : 'none';
    toggleKey.setAttribute('aria-label', hidden ? '隐藏 Key' : '显示 Key');
  });

  function hideResult() {
    var r = document.getElementById('resultToast');
    r.className = 'result';
    r.innerHTML = '';
  }

  /* ---------- Test connection (simulated) ---------- */
  var testBtn = document.getElementById('testBtn');
  var baseBtn = testBtn;

  function setTesting(on) {
    testBtn.disabled = on;
    if (on) {
      testBtn.innerHTML = '<span class="spinner"></span><span>正在测试…</span>';
    } else {
      testBtn.innerHTML = '<span>测试连接</span>';
    }
  }

  testBtn.addEventListener('click', function () {
    var provider = (document.querySelector('.provider-card.selected') || {}).dataset;
    var key = keyInput.value.trim();
    if (!key) { showResult('err', '未填写 API Key', '请在下方输入有效密钥后再试。'); return; }
    if (provider && provider.provider === 'custom' && !document.getElementById('baseUrl').value.trim()) {
      showResult('err', '缺少 Base URL', '自定义服务商需要填写 API 根地址。'); return;
    }
    setTesting(true);
    hideResult();
    setTimeout(function () {
      setTesting(false);
      // simulated connection success
      var model = modelInput.value.trim() || document.getElementById('modelName').placeholder;
      var providerName = (document.querySelector('.provider-card.selected .p-name') || {}).textContent || '服务商';
      showResult('ok', '连接成功', '已连通 ' + providerName + '，可用模型：' + model);
    }, 1400);
  });

  function showResult(kind, title, msg) {
    var r = document.getElementById('resultToast');
    var icon = kind === 'ok'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.1V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
    r.className = 'result ' + kind;
    r.innerHTML = icon + '<span><span class="r-title">' + title + '</span> — ' + msg + '</span>';
  }

  /* ---------- Save ---------- */
  document.getElementById('settingsForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!keyInput.value.trim()) { showResult('err', '未填写 API Key', '保存前请先填写密钥。'); return; }
    var msg = document.getElementById('saveMsg');
    msg.classList.add('show');
    setTimeout(function () { msg.classList.remove('show'); }, 3000);
  });
})();
</script>
</body>
</html>
